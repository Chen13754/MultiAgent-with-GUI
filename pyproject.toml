[project]
name = "crewai-multiagent-demo"
version = "0.1.0"
description = "A maintainable CrewAI multi-agent problem-solving demo."
requires-python = ">=3.10"
dependencies = [
  "crewai>=0.130.0,<2.0.0",
  "PySide6>=6.7.0,<7.0.0",
  "platformdirs>=4.0.0,<5.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0.0,<7.0.0",
  "pytest>=8.0.0,<10.0.0",
  "pytest-cov>=6.0.0,<8.0.0",
  "ruff>=0.12.0,<1.0.0",
  "mypy>=1.16.0,<2.0.0",
  "pip-audit>=2.9.0,<4.0.0",
]

[project.scripts]
multiagent-demo = "crewai_multiagent_demo.cli:main"

[tool.setuptools.package-data]
crewai_multiagent_demo = ["resources/config/*.json", "resources/*.template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["crewai_multiagent_demo"]
omit = ["*/gui/*", "*/resources/*", "*/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/crew_runner.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true
warn_unused_ignores = true
