[project]
name = "crewai-multiagent-demo"
version = "0.1.0"
description = "A maintainable CrewAI multi-agent problem-solving demo."
requires-python = ">=3.10"
dependencies = [
  "crewai>=0.130.0",
  "PySide6>=6.7.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0.0",
  "pytest>=8.0.0",
]

[project.scripts]
multiagent-demo = "crewai_multiagent_demo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
