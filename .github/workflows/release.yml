name: Build desktop bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-24.04
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run release quality gate
        run: |
          corepack pnpm --dir frontend install --frozen-lockfile
          corepack pnpm --dir frontend run test
          python -m compileall -q src tests scripts
          python -m pytest -q

      - name: Build portable bundle
        env:
          PNPM: pnpm
          PYTHONNOUSERSITE: "1"
          PYTHONUSERBASE: ${{ github.workspace }}/.cache/python-userbase
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.cache/pyinstaller
          PNPM_STORE_DIR: ${{ github.workspace }}/.cache/pnpm-store
        run: python scripts/build_gui.py

      - name: Smoke test packaged application
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/MultiagentStudio/MultiagentStudio.exe --smoke-test
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ./dist/MultiagentStudio.app/Contents/MacOS/MultiagentStudio --smoke-test
          else
            ./dist/MultiagentStudio/MultiagentStudio --smoke-test
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MultiagentStudio-${{ matrix.target }}
          path: dist/MultiagentStudio-*
          if-no-files-found: error
