name: Build desktop bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-24.04
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Run release quality gate
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run test
          python -m compileall -q src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src/crewai_multiagent_demo/config src/crewai_multiagent_demo/core src/crewai_multiagent_demo/domain src/crewai_multiagent_demo/llm src/crewai_multiagent_demo/utils
          python -m pytest --cov --cov-report=term-missing -q
          python scripts/audit_dependencies.py
          python scripts/generate_contract_types.py --check

      - name: Prepare Windows signing credentials
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64 -or -not $env:CERTIFICATE_PASSWORD) {
            throw "Windows signing secrets are required for tagged releases"
          }
          $certificate = Join-Path $env:RUNNER_TEMP "multiagent-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\signtool.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          "WINDOWS_SIGN_PFX_PATH=$certificate" | Out-File $env:GITHUB_ENV -Append
          "WINDOWS_SIGN_PFX_PASSWORD=$env:CERTIFICATE_PASSWORD" | Out-File $env:GITHUB_ENV -Append
          "SIGNTOOL_PATH=$($signTool.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Prepare macOS signing and notarization credentials
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64" && test -n "$CERTIFICATE_PASSWORD" && test -n "$SIGN_IDENTITY"
          test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_PASSWORD"
          certificate="$RUNNER_TEMP/multiagent-signing.p12"
          keychain="$RUNNER_TEMP/multiagent-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials multiagent-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --keychain "$keychain"
          echo "MACOS_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_PROFILE=multiagent-notary" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build portable bundle
        env:
          PNPM: pnpm
          PYTHONNOUSERSITE: "1"
          PYTHONUSERBASE: ${{ github.workspace }}/.cache/python-userbase
          PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.cache/pyinstaller
          PNPM_STORE_DIR: ${{ github.workspace }}/.cache/pnpm-store
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: python scripts/build_gui.py

      - name: Verify release signature
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command '$signature = Get-AuthenticodeSignature "dist/MultiagentStudio/MultiagentStudio.exe"; if ($signature.Status -ne "Valid") { throw $signature.StatusMessage }'
          elif [ "${{ runner.os }}" = "macOS" ]; then
            codesign --verify --deep --strict --verbose=2 dist/MultiagentStudio.app
            xcrun stapler validate dist/MultiagentStudio.app
          fi

      - name: Smoke test packaged application
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
          MULTIAGENT_HOME: ${{ github.workspace }}/.cache/packaged-home
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/MultiagentStudio/MultiagentStudio.exe --smoke-test
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ./dist/MultiagentStudio.app/Contents/MacOS/MultiagentStudio --smoke-test
          else
            ./dist/MultiagentStudio/MultiagentStudio --smoke-test
          fi

      - name: Packaged provider E2E against local fake service
        shell: bash
        env:
          DEEPSEEK_API_KEY: local-e2e-key
          DEEPSEEK_BASE_URL: http://127.0.0.1:8765/v1
          MULTIAGENT_HOME: ${{ github.workspace }}/.cache/provider-e2e-home
        run: |
          python scripts/fake_openai_server.py --port 8765 --max-requests 4 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8765/health && break
            sleep 1
          done
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/MultiagentStudio/MultiagentStudio.exe --provider-e2e-test
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ./dist/MultiagentStudio.app/Contents/MacOS/MultiagentStudio --provider-e2e-test
          else
            ./dist/MultiagentStudio/MultiagentStudio --provider-e2e-test
          fi

      - name: Generate SBOM
        run: python scripts/generate_sbom.py --output dist/sbom-${{ matrix.target }}.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: MultiagentStudio-${{ matrix.target }}
          path: |
            dist/MultiagentStudio-*.zip
            dist/MultiagentStudio-*.tar.gz
            dist/MultiagentStudio-*.sha256
            dist/sbom-*.cdx.json
          if-no-files-found: error

  canary:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      - name: Run controlled DeepSeek canary
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_CANARY_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          MULTIAGENT_HOME: ${{ github.workspace }}/.cache/provider-canary
        run: python scripts/provider_canary.py

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, canary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
